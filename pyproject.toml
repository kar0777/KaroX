[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "karox-runtime"
# Derived from src/karox/__init__.py, which is the single source of truth for the
# runtime version. It used to be a second literal here, and a third one inside
# the quality workflow, so the number a user sees could disagree with the wheel
# they installed. scripts/check_versions.py keeps every remaining copy honest.
dynamic = ["version"]
description = "Hybrid local runtime for native and hosted AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Keep this list in step with requirements.txt. The wheel built in CI is what
# gets installed and smoke-tested, so a dependency that is only listed in
# requirements.txt produces an install that looks complete and then fails at
# import time. Every module under src/karox that imports a third-party package
# must be represented here; scripts/check_dependencies.py enforces both halves.
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "httpx>=0.27,<1.0",
  "httpx-sse>=0.4,<1.0",
  "keyring>=25,<27",
  # Browser automation is a first-class KaroX v5 feature. The Python package is
  # installed with the normal wheel; Chromium itself is provisioned lazily by
  # karox.browser_bootstrap on first browser use so installation stays fast.
  "playwright>=1.50,<2.0",
  "mcp>=1.27,<2.0",
  "PyYAML>=6.0,<7.0",
  "textual>=0.89,<7.0",
  "rich>=13.7,<15.0",
  "Pygments>=2.17,<3.0",
  # Required by src/karox: the MCP client, the proxy server, the OAuth bridge, and
  # the transcript, which renders answers with Textual's Markdown widget and so
  # needs markdown-it-py to parse and Pygments to highlight fenced code. KaroX
  # imported both directly until it had its own Rich markdown renderer; that was
  # removed because a Rich renderable cannot be selected, and the requirement did
  # not go with it. They previously arrived only because textual and mcp happen to
  # depend on them, so a change in either one's dependency set would have broken
  # KaroX at import time with nothing here to prevent it.
  "markdown-it-py>=3.0,<5.0",
  "anyio>=4.4,<4.15",
  "starlette>=0.37,<2.0",
  # Process ownership, PID-reuse protection, and managed-service identity checks.
  "psutil>=5.9,<8.0",
  # Native desktop screenshots encode the HWND-scoped PrintWindow bitmap with
  # Pillow; declare it explicitly instead of relying on a transitive install.
  "Pillow>=11.2,<13.0",
  # tomllib is standard from 3.11; the declared 3.10 floor needs the backport.
  "tomli>=2.0,<3.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Compatibility alias for older install instructions such as `pip install
# karox-runtime[browser]`. Playwright is a base v5 dependency now; the matching
# Chromium binary is provisioned lazily on first browser use.
browser = []

[project.scripts]
karox = "karox.entrypoint:main"
karox-vnext = "karox.entrypoint:main"
karox-agent-mcp = "karox.agent_mcp:main"

# Development-only tooling, declared so CI and a contributor install the same
# versions instead of each guessing. These are PEP 735 groups: `pip install
# --group lint` needs no build of this project and pulls nothing at runtime.
[dependency-groups]
lint = ["ruff>=0.14,<1.0"]
typing = ["mypy>=1.13,<2.0", "types-PyYAML>=6.0,<7.0"]
coverage = ["coverage>=7.6,<9.0"]
# pytest is how a contributor actually runs the suite while working, even though
# the published count and CI's gate use `unittest discover`. It was undeclared,
# so the parallel runner below depended on whatever happened to be installed.
# pytest-asyncio is likewise undeclared-but-imported: tests use
# `@pytest.mark.asyncio`, and without the plugin CI's pytest fails them with
# "async def functions are not natively supported".
test = [
  "pytest>=8.0,<9.1",
  "pytest-asyncio>=0.26,<1.4",
  "pytest-xdist>=3.5,<4.0",
]
dev = [
  { include-group = "lint" },
  { include-group = "typing" },
  { include-group = "coverage" },
  { include-group = "test" },
]

[tool.pytest.ini_options]
# `-n auto` is the whole point of this section: the suite is dominated by tests
# that boot a real Textual application or spawn a real interpreter, which are
# latency-bound rather than CPU-bound. Serially the suite takes 202s; across
# workers it takes 45s for the same 705 passed / 4 skipped. A contributor who
# runs `pytest` with no arguments should get the fast path by default, because a
# check nobody is willing to wait for is a check nobody runs.
#
# Tests must therefore stay independent: anything that writes to a shared path
# has to redirect KAROX_RUNTIME_DIR/KAROX_CONFIG_DIR (both spellings) to a
# temporary directory, exactly as tests/test_web_bridge_launcher.py now does.
# `-p no:cacheprovider` keeps a parallel run from racing on .pytest_cache.
#
# One test cannot run this way at all -- it accumulates state across the tests
# before it -- so tests/conftest.py skips that single aggregator while pytest is
# distributing, and says where it is still enforced. Everything else is
# independent, which is the property to preserve when adding tests: redirect
# KAROX_RUNTIME_DIR/KAROX_CONFIG_DIR (both spellings) at a temporary directory
# instead of touching a shared one.
# `-n 6` rather than `-n auto`: on a 12-thread Windows machine `auto` oversubscribes
# the box, and tests that create a temporary Git repository start losing the race
# to delete it -- `PermissionError [WinError 32] file already in use` out of
# shutil.rmtree, in a different test on each run. Six workers reproduced no such
# failure across repeated runs and still cut the suite from 202s to under 45s;
# most of the remaining time is booting real Textual apps and child interpreters,
# so the extra workers were buying very little anyway.
# Keep the default runner self-contained. Parallel execution remains available
# to contributors who installed pytest-xdist (`pytest -n 6`), but the canonical
# verification command must not fail at argument parsing on a clean runtime.
addopts = "-q -p no:cacheprovider"
# strict keeps pytest-asyncio out of `unittest.IsolatedAsyncioTestCase`:
# in auto mode the plugin and unittest's own Runner both tried to drive the
# same coroutine methods, which failed every Textual run_test case with
# "Runner.run() cannot be called from a running event loop" on the hosted
# runners. Only explicitly marked tests go through pytest-asyncio.
asyncio_mode = "strict"
# Always test the current checkout. Without this, the first test importing karox
# directly can load an older installed wheel and poison sys.modules for the rest
# of a full run, while focused tests that import tests/_support still pass.
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "karox.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["karox*"]

[tool.setuptools.package-data]
"karox.browser_extension" = ["*.json", "*.js", "*.html", "*.css"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Deliberately narrow. E9 catches syntax and indentation errors, F is pyflakes:
# undefined names, unused imports, duplicate definitions, broken f-strings. That
# set is clean today, so CI can enforce it as a gate instead of printing a
# thousand style findings nobody acts on. Widen it by fixing a rule family and
# adding it here in the same commit.
select = ["E9", "F"]

[tool.mypy]
python_version = "3.10"
# Static analysis targets the primary shipping host: several runtime modules
# branch on `os.name == "nt"` and call `msvcrt` / `ctypes.WinDLL` / `windll`,
# which typeshed exposes only under the win32 platform view. Without this pin
# the same clean tree FAILS mypy on a Linux/macOS host (CI lint) because those
# guarded symbols are absent there. Runtime paths stay platform-independent.
platform = "win32"
files = ["src/karox"]
# Deliberately the level the code passes today, in the same spirit as the ruff
# selection above: mypy's defaults over the whole package, plus the extra
# hygiene flags the tree is already clean under. There is no blanket
# `ignore_missing_imports` and no global `ignore_errors`; the only exemptions are
# the named modules in the override below, so a new type error in any other
# module -- or in a module added later -- fails CI.
#
# What is NOT enabled yet: `disallow_untyped_defs` and the rest of `--strict`.
# Turning them on today reports thousands of findings across a package that is
# largely, but not fully, annotated, which would make the gate unusable rather
# than useful. Raise it one flag at a time, fixing the findings in the same
# commit that enables the flag.
# `warn_unused_ignores` is deliberately absent: the keyring import in
# credentials.py carries an ignore that is needed only where keyring is not
# installed, so the flag's verdict depends on the environment rather than on the
# code, and it would fail CI while passing for a contributor.
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# `tomli` is the 3.10 fallback for `tomllib`, so it is only installed below 3.11
# and mypy cannot find it on any newer interpreter. Excused by name rather than
# with `ignore_missing_imports` globally, which would also hide a genuinely
# missing dependency.
module = ["tomli"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Playwright is a normal KaroX v5 runtime dependency, but some minimal/static
# type-check environments intentionally resolve the source tree without first
# installing browser dependencies. Keep this exemption scoped to Playwright
# rather than hiding missing imports globally.
module = ["playwright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The ten modules below do not pass mypy's defaults yet: 52 findings, mostly a
# JSON-shaped local rebound between `dict` and `list` in the CLI's report
# builders, which alone accounts for 20. They are excused BY NAME and with a
# count so the debt is visible and finite. Delete a name when its module is
# fixed; never add one. `karox.packs` was deleted from this list once its seven
# findings were fixed, taking the count from 59 -- that is the intended
# direction of travel.
module = [
  "karox.agent",
  "karox.cli",
  "karox.core",
  "karox.mcp_client",
  "karox.oauth_bridge",
  "karox.openapi_bridge",
  "karox.provider_adapters",
  "karox.sessions",
  "karox.tui",
  "karox.web_bridge_launcher",
]
ignore_errors = true

[tool.coverage.run]
source = ["src/karox"]
branch = true
# The suite runs threads and multiprocessing workers, so both are declared and
# the data is written per process and combined afterwards. What this does NOT
# measure is the plain `subprocess` CLI end-to-end runs: those would need
# COVERAGE_PROCESS_START and a sitecustomize hook in the child. The reported
# figure therefore understates the code those tests really execute -- which is
# the safe direction for a gate, but worth knowing before reading it as truth.
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
# The suite measures 75% statement+branch coverage of src/karox today. The gate
# sits at 70 to leave room for platform-skipped branches on the other CI runners
# rather than to flatter the number. Treat it as a ratchet: raise it when new
# tests earn it, and never lower it to make a red run go green.
fail_under = 70
skip_covered = false
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "/././.$",
]

[tool.ruff.lint.per-file-ignores]
# Each test module inserts src on sys.path through this import for its side
# effect, so the name itself is genuinely unused.
"tests/*" = ["F401"]
# ProcessTree is retained as an explicit compatibility import beside the
# platform-specific process-tree fallback used by this module.
"src/karox/remote_tools.py" = ["F401"]
