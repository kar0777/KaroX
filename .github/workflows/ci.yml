name: ci
on:
  push:
    branches: ["karox6/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Sync
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest
      - name: Perf gate (start time, idle RSS)
        run: uv run python scripts/perf_check.py
  wheel:
    name: wheel smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build
        run: uv build --wheel
      - name: Install into a clean environment (no compilers needed)
        run: |
          uv venv --python 3.12 /tmp/clean
          if [ "$RUNNER_OS" = Windows ]; then BIN=/tmp/clean/Scripts; else BIN=/tmp/clean/bin; fi
          VIRTUAL_ENV=/tmp/clean uv pip install dist/*.whl
          "$BIN/karox" --version
          "$BIN/python" scripts/smoke_installed.py "$BIN/karox"
      - name: Install as a tool with the tui extra
        run: |
          WHEEL=$(ls dist/*.whl)
          uv tool install "${WHEEL}[tui]"
          python -c "import shutil; print(shutil.which('karox'))"
          karox --version
          uv tool run --from "${WHEEL}[tui]" python -c "import prompt_toolkit"
      - name: Install with pipx
        run: |
          WHEEL=$(ls dist/*.whl)
          PY=$(uv python find 3.12)
          uvx pipx install --python "$PY" --suffix=-pipx "${WHEEL}"
          BIN=$(uvx pipx environment --value PIPX_BIN_DIR)
          "$BIN/karox-pipx" --version
