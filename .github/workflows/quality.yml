name: Product quality

on:
  pull_request:
  push:
    branches: [main, agent/max-product-overhaul]
  # release.yml calls this workflow so publishing cannot begin before the suite
  # has passed on the commit being released.
  workflow_call:

permissions:
  contents: read

jobs:
  static-checks:
    name: Lint and dependency declarations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Runs on the standard library alone, so it executes before anything is
      # installed and catches a dependency that is imported but not declared.
      - name: Check dependency declarations
        run: python scripts/check_dependencies.py

      - name: Check version sources agree
        run: python scripts/check_versions.py

      - name: Install ruff
        run: python -m pip install --upgrade pip && python -m pip install --group lint

      - name: Lint
        run: python -m ruff check src tests scripts

  types:
    name: Static types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Runtime dependencies come first: without them mypy reports missing
      # imports for every third-party package and the real findings drown.
      - name: Install dependencies and mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --group typing

      - name: Type-check the runtime
        run: python -m mypy src/karox

  coverage:
    name: Suite coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and coverage
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --group coverage

      # Runs here rather than in the lint job because it imports the test
      # modules, so it needs the runtime's dependencies. Cheap, and it fails on a
      # stale figure before the expensive coverage run starts.
      - name: Check the published test counts
        run: python scripts/check_test_count.py

      # unittest, not pytest: pytest counts subtests separately, so its pass
      # tally moves between runs and cannot be used as a gate. The threshold is
      # the level the suite actually reaches today -- raise it with the coverage
      # it earns, never lower it to make a run go green.
      - name: Measure coverage
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py"
          # Parallel mode is on so subprocess children report too, which means
          # the per-process data files have to be combined before reporting.
          python -m coverage combine
          python -m coverage report
          python -m coverage xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  vnext-runtime:
    name: vNext artifact · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.10 is the floor declared in pyproject.toml. It was never exercised
        # here before, so an unconditional 3.11-only import shipped in a release
        # that claimed to support it and died before argparse ran.
        python: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Build and install the vNext wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip install --force-reinstall dist/karox_runtime-*.whl
          python -m pip check

      # The expected version is read from the source of truth rather than
      # repeated here. A literal in this file was one of three disagreeing
      # copies, and it is the copy nobody remembers to update.
      - name: Smoke-test the installed artifact
        shell: bash
        run: |
          EXPECTED="$(python scripts/check_versions.py --print runtime)"
          EXPECTED="$EXPECTED" python -c "import karox, os; assert karox.__version__ == os.environ['EXPECTED'], karox.__version__"
          karox --help
          karox-vnext --help
          karox paths --json

      # The suite imports karox from src through tests/_support.py, which shadows
      # the wheel installed above. Importing the installed package from a
      # different working directory is the only step here that proves the
      # artifact itself is complete.
      - name: Prove the installed wheel imports without the source tree
        shell: bash
        run: |
          cd "${{ runner.temp }}"
          python -c "import karox.cli, karox.tui, karox.packs; print('installed artifact imports')"

      - name: Run the complete vNext suite
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py" -v

  cross-platform:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
        shell: bash

      - name: Validate dependency environment
        run: python -m pip check

      - name: Compile Python sources
        run: >-
          python -m py_compile
          server/repo_tools.py server/app_entry.py server/mcp_host_security.py server/notion_gateway.py server/notion_entry.py
          server/notion_agent_tools.py
          scripts/patch_notion_provider.py scripts/patch_native_notion_provider.py scripts/notion_doctor.py scripts/notion_profile.py
          scripts/native_notion_provider.py scripts/notion_setup_wizard.py scripts/tailscale_readiness.py
          scripts/product_doctor.py scripts/karox_admin.py scripts/karox_cli.py scripts/karox_stop.py scripts/karox_admin_entry.py scripts/karox_paths.py
          scripts/sitecustomize.py scripts/support_bundle.py scripts/support_bundle_entry.py scripts/rebrand_runtime.py
          scripts/test_notion_provider.py scripts/test_notion_profile.py scripts/test_tailscale_readiness.py
          scripts/test_path_migration.py scripts/test_runtime_rebrand.py scripts/test_product_doctor.py
          scripts/test_mcp_host_security.py scripts/test_notion_mcp_transport.py scripts/test_admin_cli.py scripts/test_app_entry.py
          scripts/test_tunnel_session_flow.py scripts/test_installer_transaction.py

      - name: Test provider generation
        shell: bash
        run: python scripts/test_notion_provider.py 2>&1 | tee provider-test.log

      - name: Test persistent Notion profile
        shell: bash
        run: python scripts/test_notion_profile.py 2>&1 | tee notion-profile-test.log

      - name: Test Tailscale readiness
        shell: bash
        run: python scripts/test_tailscale_readiness.py 2>&1 | tee tailscale-readiness-test.log

      - name: Test tunnel selection and parallel-session guard
        shell: bash
        run: python scripts/test_tunnel_session_flow.py 2>&1 | tee tunnel-session-test.log

      - name: Test atomic installer and updater contracts
        shell: bash
        run: python scripts/test_installer_transaction.py 2>&1 | tee installer-transaction-test.log

      - name: Test path migration
        shell: bash
        run: PYTHONPATH=scripts python scripts/test_path_migration.py 2>&1 | tee path-migration-test.log

      - name: Test installed runtime rebrand
        shell: bash
        run: PYTHONPATH=scripts python scripts/test_runtime_rebrand.py 2>&1 | tee runtime-rebrand-test.log

      - name: Test installed layout doctor
        shell: bash
        run: python scripts/test_product_doctor.py 2>&1 | tee doctor-layout-test.log

      - name: Test MCP tunnel host security
        shell: bash
        run: python scripts/test_mcp_host_security.py 2>&1 | tee mcp-host-test.log

      - name: Test Notion MCP transport middleware
        shell: bash
        run: python scripts/test_notion_mcp_transport.py 2>&1 | tee mcp-transport-test.log

      - name: Run Notion provider doctor
        shell: bash
        run: python scripts/notion_doctor.py --root . 2>&1 | tee notion-doctor-test.log

      - name: Test admin CLI and redaction
        shell: bash
        run: python scripts/test_admin_cli.py 2>&1 | tee admin-test.log

      - name: Test hardened API runtime
        shell: bash
        run: python scripts/test_app_entry.py 2>&1 | tee runtime-test.log

      - name: Smoke-test public CLI metadata
        shell: bash
        run: |
          {
            python scripts/karox_cli.py version --json
            python scripts/karox_cli.py status --json
            python scripts/karox_cli.py stop --json
            python scripts/karox_cli.py doctor --json
          } 2>&1 | tee smoke-test.log

      - name: Validate generated launcher in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python scripts/patch_notion_provider.py --platform powershell --source start.core.ps1 --output generated.windows.ps1 --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'generated.windows.ps1'))
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) { throw 'Generated launcher is missing UTF-8 BOM.' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'generated.windows.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { Write-Error ($errors | Out-String); exit 1 }

      - name: Validate POSIX syntax
        if: runner.os != 'Windows'
        run: bash -n bootstrap.sh install.sh install.karox.sh start.sh start.core.sh

      - name: Parse PowerShell entrypoints with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          $details = New-Object System.Collections.Generic.List[string]
          foreach ($file in @('bootstrap.ps1','install.ps1','install.karox.ps1','start.ps1','start.core.ps1','doctor.ps1','uninstall.ps1','scripts/install_guard.ps1')) {
            $path = Resolve-Path $file
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $details.Add("===== $file =====")
              foreach ($error in $errors) {
                $details.Add("line=$($error.Extent.StartLineNumber) column=$($error.Extent.StartColumnNumber) message=$($error.Message)")
                $details.Add("text=$($error.Extent.Text)")
              }
            }
          }
          $details | Set-Content -LiteralPath powershell-parser.log -Encoding UTF8
          if ($failed) { Write-Error ($details -join [Environment]::NewLine); exit 1 }

      - name: Upload matrix diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            provider-test.log
            notion-profile-test.log
            tailscale-readiness-test.log
            path-migration-test.log
            runtime-rebrand-test.log
            doctor-layout-test.log
            mcp-host-test.log
            mcp-transport-test.log
            notion-doctor-test.log
            admin-test.log
            runtime-test.log
            smoke-test.log
            powershell-parser.log
            generated.windows.ps1
          if-no-files-found: ignore
