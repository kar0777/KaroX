name: CodeQL

# src/karox was missing from these filters, so the OAuth bridge, the MCP proxy,
# the credential store and the policy engine -- the whole security surface of the
# vNext runtime -- were never scanned on a pull request. Only the scheduled run
# saw them, and only on main.
on:
  pull_request:
    paths:
      - "src/**/*.py"
      - "server/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
    paths:
      - "src/**/*.py"
      - "server/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
