name: CodeQL

# src/karox was missing from these filters, so the OAuth bridge, the MCP proxy,
# the credential store and the policy engine -- the whole security surface of the
# vNext runtime -- were never scanned on a pull request. Only the scheduled run
# saw them, and only on main.
on:
  pull_request:
    paths:
      - "src/**/*.py"
      - "server/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
    paths:
      - "src/**/*.py"
      - "server/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  # A green run here means the scan completed, NOT that it found nothing.
  # `analyze` uploads its results and succeeds regardless of what they say, so
  # this job is not the gate and must not be read as one: what blocks a merge is
  # the "Code scanning results" required status check in branch protection, which
  # is a repository setting and cannot be declared in this file. Without that
  # setting enabled, findings are reported in the Security tab and nothing stops
  # a merge.
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
